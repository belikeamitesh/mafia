<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mafia Night</title>
<meta name="description" content="Play Mafia online with friends — share a link, get a secret role, find the Mafia.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔪</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="landing">
  <div class="hero">
    <div style="font-size:54px">🔪</div>
    <h1 class="title">MAFIA</h1>
    <p class="muted">Lie. Deduce. Survive. Play with friends — just share a link.</p>
    <div class="card stack">
      <input id="nameIn" maxlength="16" placeholder="Your name" autocomplete="nickname">
      <div id="joinBox" class="stack hidden">
        <div class="muted" style="font-size:13px">Joining room <b id="joinCode"></b></div>
        <button class="primary" id="joinBtn">Join game</button>
      </div>
      <div id="createBox" class="stack">
        <button class="primary hidden" id="rejoinBtn"></button>
        <button class="primary" id="createBtn">Create a room</button>
        <div class="or">or join with a code</div>
        <div class="row"><input id="codeIn" maxlength="8" placeholder="Room code" style="text-transform:uppercase"><button id="codeBtn">Join</button></div>
      </div>
      <button class="ghost" onclick="showRules()">📖 How to play</button>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <span class="logo">🔪</span>
    <span class="chip">Room <b id="hCode"></b></span>
    <button class="chip" id="shareBtn">🔗 Invite</button>
    <span class="chip phase" id="hPhase"></span>
    <span class="chip timer hidden" id="hTimer"></span>
    <span class="spacer"></span>
    <span class="chip role-chip hidden" id="hRole"></span>
    <button class="chip hidden" id="closeBtn" title="End the game, clear the chat and delete this room">⏹ Stop</button>
    <button class="chip" id="muteBtn"></button>
    <button class="chip" onclick="showRules()" title="Rules">📖</button>
    <button class="chip" id="leaveBtn" title="Leave">🚪</button>
  </header>
  <main>
    <section id="left" class="show">
      <div class="card phasecard" id="phaseCard"></div>
      <div class="players" id="players"></div>
    </section>
    <section id="chat">
      <div class="tabs" id="tabs"></div>
      <div id="msgs"></div>
      <div class="typing" id="typing"></div>
      <button type="button" id="actionBanner" class="actbanner hidden"></button>
      <div id="mentionList" class="mentions hidden"></div>
      <div id="emojiPanel" class="emojis hidden"><emoji-picker id="emojiPicker" class="dark"></emoji-picker></div>
      <div id="replyBar" class="replybar hidden"><div class="quote" id="replyQuote"></div><button type="button" class="ghost" id="replyCancel" title="Cancel reply">✕</button></div>
      <form class="composer" id="composer">
        <textarea id="msgIn" maxlength="400" placeholder="Say something…"></textarea>
        <div id="recBar" class="recbar hidden"><span class="recdot"></span><span id="recTime">0:00</span><span class="muted">Recording… tap ⏹ to send</span><button type="button" class="ghost" id="recCancel" title="Discard">✕</button></div>
        <button type="button" id="emojiBtn" title="Emoji">😊</button>
        <button type="button" id="micBtn" title="Record a voice note (up to 30 seconds)">🎤</button>
        <button class="primary" id="sendBtn">Send</button>
      </form>
    </section>
  </main>
  <nav class="mnav"><button data-pane="left" class="on">👥 Players</button><button data-pane="chat">💬 Chat <span id="mBadge"></span></button></nav>
</div>

<div id="overlayRoot"></div>
<div class="toasts" id="toasts"></div>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.29.1/index.js"></script>
<script src="/app.js"></script>
</body>
</html>
